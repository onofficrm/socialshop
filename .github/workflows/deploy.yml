name: Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: socialshop-ftp-deploy
  cancel-in-progress: true

jobs:
  malware-cleanup-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Scan and remove malware via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          set -euo pipefail
          cat > /tmp/ftp-clean.py <<'PY'
          import ftplib
          import os
          import sys
          from typing import List, Tuple

          host = os.environ["FTP_SERVER"]
          user = os.environ["FTP_USERNAME"]
          password = os.environ["FTP_PASSWORD"]
          port = int(os.environ.get("FTP_PORT") or "21")

          # Exact / partial names reported by host + common webshells
          NAME_HITS = {
              "moc.php",
              "zor",
              "zor.php",
              "wso.php",
              "c99.php",
              "r57.php",
              "shell.php",
              "cmd.php",
              "alfa.php",
              "alfa3.php",
              "byp.php",
              "up.php",
              "upload.php",
              "xx.php",
              "x.php",
              "1.php",
              "2.php",
              "a.php",
              "wp-login.php",
              "xmlrpc.php",
          }
          NAME_CONTAINS = ("moc", "zor", "webshell", "c99", "r57", "wso", "alfa", "b374k")

          roots = ["/", "/public_html", "/www", "/httpdocs", "/home"]
          deleted: List[str] = []
          scanned: List[str] = []
          suspicious: List[str] = []

          def connect() -> ftplib.FTP:
              ftp = ftplib.FTP()
              ftp.connect(host, port, timeout=60)
              ftp.login(user, password)
              ftp.set_pasv(True)
              return ftp

          def list_entries(ftp: ftplib.FTP, path: str) -> List[Tuple[str, bool]]:
              entries: List[Tuple[str, bool]] = []
              try:
                  ftp.cwd(path)
              except Exception:
                  return entries
              try:
                  for name, facts in ftp.mlsd():
                      if name in (".", ".."):
                          continue
                      is_dir = facts.get("type") == "dir"
                      entries.append((name, is_dir))
                  return entries
              except Exception:
                  pass
              # fallback NLST
              try:
                  names = ftp.nlst()
              except Exception:
                  return entries
              for raw in names:
                  name = raw.split("/")[-1]
                  if name in (".", ".."):
                      continue
                  # probe directory
                  is_dir = False
                  cur = ftp.pwd()
                  try:
                      ftp.cwd(name)
                      ftp.cwd(cur)
                      is_dir = True
                  except Exception:
                      is_dir = False
                  entries.append((name, is_dir))
              return entries

          def should_delete(name: str, is_dir: bool) -> bool:
              lower = name.lower()
              if lower in NAME_HITS or name in NAME_HITS:
                  return True
              if any(x in lower for x in NAME_CONTAINS):
                  return True
              # This site is static HTML only — any PHP under web roots is suspicious
              if (not is_dir) and lower.endswith(".php"):
                  return True
              if (not is_dir) and lower.endswith((".phtml", ".phar", ".php5", ".php7", ".suspected")):
                  return True
              return False

          def rm_tree(ftp: ftplib.FTP, path: str) -> None:
              # path is absolute or cwd-relative full path we tracked
              try:
                  ftp.cwd(path)
              except Exception:
                  # maybe file
                  try:
                      ftp.delete(path)
                      deleted.append(path)
                  except Exception as e:
                      print(f"FAIL delete file {path}: {e}")
                  return
              for name, is_dir in list_entries(ftp, path):
                  child = path.rstrip("/") + "/" + name
                  if is_dir:
                      rm_tree(ftp, child)
                  else:
                      try:
                          ftp.delete(child)
                          deleted.append(child)
                          print(f"DELETED file {child}")
                      except Exception as e:
                          print(f"FAIL delete file {child}: {e}")
              # remove directory itself (except web roots)
              if path.rstrip("/") not in ("", "/public_html", "/www", "/httpdocs", "/home"):
                  parent = "/".join(path.rstrip("/").split("/")[:-1]) or "/"
                  base = path.rstrip("/").split("/")[-1]
                  try:
                      ftp.cwd(parent)
                      ftp.rmd(base)
                      deleted.append(path + "/")
                      print(f"DELETED dir {path}/")
                  except Exception as e:
                      print(f"FAIL rmdir {path}: {e}")

          def walk(ftp: ftplib.FTP, path: str, depth: int = 0) -> None:
              if depth > 12:
                  return
              scanned.append(path)
              for name, is_dir in list_entries(ftp, path):
                  child = path.rstrip("/") + "/" + name
                  if should_delete(name, is_dir):
                      suspicious.append(child + ("/" if is_dir else ""))
                      print(f"HIT {child}{'/' if is_dir else ''}")
                      if is_dir:
                          rm_tree(ftp, child)
                      else:
                          try:
                              # delete relative to parent
                              parent = path
                              ftp.cwd(parent)
                              ftp.delete(name)
                              deleted.append(child)
                              print(f"DELETED file {child}")
                          except Exception as e:
                              print(f"FAIL delete {child}: {e}")
                      continue
                  if is_dir:
                      # skip heavy/system dirs
                      if name.lower() in ("mail", "logs", "tmp", "etc", "ssl", "cgi-bin"):
                          continue
                      walk(ftp, child, depth + 1)

          ftp = connect()
          print(f"Connected to {host}:{port} as {user}")
          print(f"PWD={ftp.pwd()}")
          # Discover usable roots from login home
          home = ftp.pwd()
          candidates = [home, home.rstrip("/") + "/public_html", "/public_html", "/www"]
          seen = set()
          for root in candidates:
              key = root.rstrip("/") or "/"
              if key in seen:
                  continue
              seen.add(key)
              try:
                  ftp.cwd(root)
                  print(f"SCAN root {root}")
                  walk(ftp, root if root.startswith("/") else ftp.pwd())
              except Exception as e:
                  print(f"SKIP root {root}: {e}")

          print("--- SUMMARY ---")
          print(f"scanned_dirs={len(scanned)}")
          print(f"hits={len(suspicious)}")
          for s in suspicious:
              print(f"  hit: {s}")
          print(f"deleted={len(deleted)}")
          for d in deleted:
              print(f"  del: {d}")
          ftp.quit()
          PY
          python3 /tmp/ftp-clean.py

      - name: Clean-slate deploy static site
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          parallel: 1
          protocol: ftp
          local-dir: ./
          server-dir: /public_html/
          dangerous-clean-slate: true
          state-name: socialshop-deploy-v3-clean
          log-level: standard
          exclude: |
            **/.git*
            **/.github/**
            **/.DS_Store
            **/.vscode/**
            **/._*
            README.md
            _backup_transfer_*/
            **/_backup_transfer_*/
            data/**
            cache/**
            session/**
            tmp/**
            *.log
            .env
            .env.*
